name: Build & Release APK

on:
  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.xml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            # --ignore-garbage sorgt dafuer, dass versehentlich im Secret enthaltene
            # CR/LF- oder Whitespace-Zeichen (z. B. durch Kopieren unter Windows) beim
            # Dekodieren ignoriert werden, statt die Binaerdaten des Keystores zu zerstoeren.
            echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "Kein KEYSTORE_BASE64 Secret gesetzt - Build wird unsigniert erstellt."
          fi

      - name: Validate Keystore
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keystore "$KEYSTORE_FILE" > /dev/null 2>&1; then
            echo "::error::Keystore konnte nicht gelesen werden. Pruefe die Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD und KEY_ALIAS (moeglicherweise falsches Passwort oder beschaedigtes Base64)."
            exit 1
          fi
          echo "Keystore erfolgreich validiert."

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK with timestamp name
        id: apk
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          NEW_NAME="PassPorta-${TIMESTAMP}.apk"
          cp "$APK_SOURCE" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.apk.outputs.timestamp }}
          name: PassPorta ${{ steps.apk.outputs.timestamp }}
          body: |
            Automatischer Build ausgeloest durch Commit ${{ github.sha }}.

            **Commit-Nachricht:** ${{ github.event.head_commit.message }}
          files: ${{ steps.apk.outputs.apk_name }}
          generate_release_notes: true


