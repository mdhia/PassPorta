[versions]
agp = "9.3.3"
# Explizites Kotlin-Plugin statt AGP-Built-in-Kotlin: die aktuellen AndroidX-/Compose-Artefakte
# tragen Kotlin-2.4-Metadaten, die der eingebaute 2.2.x-Compiler nicht lesen kann.
kotlin = "2.4.10"
# KSP 2.x ist von der Kotlin-Version entkoppelt.
ksp = "2.3.11"

# AndroidX Basis / Compose
coreKtx = "1.19.0"
material = "1.10.0"
appcompat = "1.7.1"
documentfile = "1.1.0"
activity = "1.12.4"
composeBom = "2026.08.00"
lifecycle = "2.11.0"
navigation = "2.10.0"
palette = "1.0.0"
room = "2.8.4"
exifinterface = "1.4.1"

# Offline-Feature-Libraries
coil = "3.6.2"
zxing = "3.5.4"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"
kotlinxSerializationJson = "1.9.0"

# Tests
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# --- AndroidX Basis ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# Nur noch fuer das XML-Fenster-Theme; die Oberflaeche ist vollstaendig Compose.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Per-App-Language (AppCompatDelegate.setApplicationLocales) fuer API < 33 - noetig, weil das
# System-Feature "App-Sprache" erst ab Android 13 ohne Bibliothek funktioniert.
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }

# --- Jetpack Compose (Material 3) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Vollstaendige Material-Symbols als ImageVector - Grundlage der durchsuchbaren Icon-Auswahl.
# Version kommt aus der BOM (dort auf 1.7.8 festgeschrieben, das Artefakt wird nicht mehr erweitert).
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# --- Room ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# --- Farben, Bilder, Barcodes, Offline-ML, JSON ---
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
# Liest die Aufnahmeorientierung aus Kamerafotos - ohne sie steht Text im Bild oft quer.
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# --- Tests ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
